# PlayerPoints integration for speeding up active crafts.
craft-speed-up:
  enabled: true
  enable-decorations: true # Added this
  fill-item: "BLACK_STAINED_GLASS_PANE" # Added this
  options:
    'tier1':
      slot: 11
      material: "CLOCK"
      custom-model-data: 1001
      display-name: "&aTime Shard"
      lore:
        - "&7Reduce craft time by &e{time}&7."
        - ""
        - "&7Cost: &b{cost} Points"
      reduce-seconds: 300
      points-cost: 25

    'tier2':
      slot: 13
      material: "EXPERIENCE_BOTTLE"
      custom-model-data: 1001
      display-name: "&bTime Elixir"
      lore:
        - "&7Reduce remaining time by &e{percentage}%&7."
        - "&7This will skip &e{time_skipped}&7."
        - ""
        - "&7Cost: &b{cost} Points"
      reduce-percentage: 25
      points-cost: 50

    'tier3':
      slot: 15
      material: "NETHER_STAR"
      custom-model-data: 1001
      display-name: "&6Instant Finish"
      lore:
        - "&7Instantly completes this craft."
        - "&7Remaining Time: &e{time_remaining}"
        - ""
        - "&7Cost: &b{cost} Points"
      points-per-second: 0.5

